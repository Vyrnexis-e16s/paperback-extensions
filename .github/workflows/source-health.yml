name: Source health

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  health:
    name: Reachability check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Probe source websites
        env:
          HEALTH_DELAY_MS: "2000"
          HEALTH_LIMIT: "40"
          HEALTH_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEALTH_REPO: ${{ github.repository }}
        run: npm run health
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: health-report
          path: reports/testing/health.json
