version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      paperback:
        patterns:
          - "@paperback/toolchain"
          - "@paperback/types"
          - "@paperback/runtime-polyfills"
      minor-patch:
        update-types:
          - minor
          - patch
